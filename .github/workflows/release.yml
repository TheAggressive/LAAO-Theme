name: CI/CD Pipeline

# Every job below maps 1:1 onto a `pnpm ci:*` script, so `pnpm ci:verify`
# locally runs the same commands this workflow does. If you add a lane here,
# add it to bin/ci/verify.sh too — otherwise "green locally" stops meaning
# "green in CI".

on:
    push:
        branches: [main, master]
    pull_request:
        branches: [main, master]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    THEME_SLUG: laao
    # Keep in step with package.json "engines" and .node-version.
    NODE_VERSION: '24.18.1'
    PNPM_VERSION: '11.1.2'
    PHP_VERSION: '8.4'

jobs:
    frontend:
        name: 🔍 Frontend
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: ${{ env.PNPM_VERSION }}

            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: pnpm

            - name: Verify toolchain
              run: pnpm ci:doctor

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # ESLint, Stylelint, Prettier, tsc, file-length budget, Jest.
            - name: Lint, type-check and unit-test
              run: pnpm ci:frontend

    php:
        name: 🔍 PHP
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ env.PHP_VERSION }}
                  tools: composer:v2
                  coverage: none

            - name: Cache Composer dependencies
              uses: actions/cache@v4
              with:
                  path: vendor
                  key: ${{ runner.os }}-vendor-${{ hashFiles('**/composer.lock') }}
                  restore-keys: ${{ runner.os }}-vendor-

            - name: Install dependencies
              run: composer install --no-interaction --prefer-dist --no-progress

            # PHPCS (WordPress + VIP security/performance), PHPStan level 8, PHPUnit.
            - name: Lint, analyse and test
              run: |
                  composer run-script phpcs
                  composer run-script analyse
                  vendor/bin/phpunit

    build:
        name: 🔨 Build
        runs-on: ubuntu-latest
        needs: [frontend, php]
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: ${{ env.PNPM_VERSION }}

            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build
              run: pnpm ci:build

            - name: Upload build output
              uses: actions/upload-artifact@v4
              with:
                  name: dist
                  path: dist/
                  retention-days: 7

    e2e:
        name: 🎭 End-to-end
        runs-on: ubuntu-latest
        needs: [build]
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: ${{ env.PNPM_VERSION }}

            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # E2E runs against the real built theme, not source.
            - name: Download build output
              uses: actions/download-artifact@v4
              with:
                  name: dist
                  path: dist/

            - name: Install Playwright browser
              run: pnpm test:e2e:install

            - name: Start WordPress
              run: pnpm env:start

            - name: Activate theme
              run: pnpm cli theme activate laao

            - name: Run E2E specs
              run: pnpm ci:e2e

            - name: Upload failure artefacts
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report
                  path: |
                      playwright-report/
                      tests/e2e/.results/
                  retention-days: 7

    package:
        name: 📦 Package
        runs-on: ubuntu-latest
        needs: [build, e2e]
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: ${{ env.PNPM_VERSION }}

            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Download build output
              uses: actions/download-artifact@v4
              with:
                  name: dist
                  path: dist/

            # Builds the zip and asserts it is installable: checksum matches,
            # one top-level directory, correct version, no build tooling inside.
            - name: Build and verify package
              run: pnpm ci:package

    release:
        name: 🚀 Release
        runs-on: ubuntu-latest
        needs: [package]
        if: |
            github.event_name == 'push' &&
            (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        timeout-minutes: 10
        permissions:
            contents: write
            issues: write
            pull-requests: write
            id-token: write
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  token: ${{ secrets.GITHUB_TOKEN }}

            - uses: pnpm/action-setup@v4
              with:
                  version: ${{ env.PNPM_VERSION }}

            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # semantic-release decides whether this commit warrants a release.
            # bin/release/prepare.sh repackages from this dist/.
            - name: Download build output
              uses: actions/download-artifact@v4
              with:
                  name: dist
                  path: dist/

            - name: Configure Git
              run: |
                  git config --global user.name "github-actions[bot]"
                  git config --global user.email "github-actions[bot]@users.noreply.github.com"

            - name: Semantic Release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  HUSKY: '0'
              run: pnpm semantic-release
