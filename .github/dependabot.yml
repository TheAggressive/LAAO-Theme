version: 2

# Keep routine dependency maintenance low-noise: monthly, grouped, and limited
# to minor/patch releases. Security updates remain eligible and are grouped
# separately so critical fixes are not suppressed by routine version policy.
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    cooldown:
      default-days: 14
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 7
    allow:
      - dependency-name: '*'
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      wordpress:
        applies-to: version-updates
        patterns:
          - '@wordpress/*'
        update-types:
          - minor
          - patch
      eslint:
        applies-to: version-updates
        patterns:
          - 'eslint'
          - 'eslint-*'
          - '@eslint/*'
          - '@typescript-eslint/*'
        update-types:
          - minor
          - patch
      testing:
        applies-to: version-updates
        patterns:
          - '@playwright/*'
          - 'jest'
          - 'jest-*'
          - '@types/jest'
        update-types:
          - minor
          - patch
      dev-minor-patch:
        applies-to: version-updates
        dependency-type: development
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      security-updates:
        applies-to: security-updates
        patterns:
          - '*'
    commit-message:
      prefix: 'chore'
      include: scope

  - package-ecosystem: composer
    directory: '/'
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    cooldown:
      default-days: 14
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 7
    allow:
      - dependency-name: '*'
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      php-quality:
        applies-to: version-updates
        patterns:
          - 'phpstan/*'
          - 'szepeviktor/*'
          - 'squizlabs/*'
          - 'wp-coding-standards/*'
          - 'automattic/vipwpcs'
          - 'phpcompatibility/*'
          - 'dealerdirect/*'
        update-types:
          - minor
          - patch
      routine-composer:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      security-updates:
        applies-to: security-updates
        patterns:
          - '*'
    commit-message:
      prefix: 'chore'
      include: scope

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    cooldown:
      default-days: 14
    allow:
      - dependency-name: '*'
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      actions:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      security-actions:
        applies-to: security-updates
        patterns:
          - '*'
    commit-message:
      prefix: 'ci'
