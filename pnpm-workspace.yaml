# pnpm 11 blocks dependency build scripts unless they are listed here.
#
# Keeping this explicit means a new transitive dependency cannot silently run
# arbitrary code at install time — adding one is a reviewable change. Only
# @parcel/watcher genuinely needs its native build (file watching for
# `wp-scripts start`); the rest either print funding notices or ship a working
# JavaScript fallback.
packages: []

allowBuilds:
    '@parcel/watcher': true
    core-js: false
    core-js-pure: false
    fs-ext-extra-prebuilt: false
    unrs-resolver: false

# Security overrides for advisories GitHub reports against transitive
# dependencies.
#
# These MUST live here, not in package.json's `pnpm.overrides`: with a
# pnpm-workspace.yaml present, pnpm 10+ reads overrides from this file and
# silently ignores the package.json field.
#
# Ranges are pinned within the major each consumer declares. An unscoped range
# crosses a major for some consumer and breaks it — brace-expansion is the
# example: minimatch 3 needs the 1.x line, while minimatch 9/10 declare ^2/^5
# and call a named export 1.x does not have.
#
# Everything here except dompurify is build tooling. The released theme ships
# dist/ only, never node_modules, so those are supply-chain risks to the build
# rather than to visitors.
overrides:
    # The one that actually ships. DOMPurify is bundled into the image-credit
    # editor plugins via src/components/ContentEditable.js, where it sanitises
    # user input — so running a version with known mXSS bypasses means the
    # sanitiser itself can be defeated. isomorphic-dompurify declares ^3.2.5,
    # so this stays in-major.
    dompurify: '^3.4.13'

    # Only the 1.x line is affected; 2.x and 5.x are not.
    'brace-expansion@1': '^1.1.18'

    flatted: '^3.4.2'
    'glob@10': '^10.5.0'
    'js-yaml@<4': '^3.15.1'
    'js-yaml@>=4': '^4.3.1'
    'minimatch@3': '^3.1.4'
    picomatch: '^4.0.4'
    postcss: '^8.5.23'
    'serialize-javascript@>=5': '^7.0.5'
    shell-quote: '^1.9.0'
    svgo: '^3.3.4'
    uuid: '^11.1.1'
    ws: '^8.21.0'
    'yaml@1': '^1.10.3'
    'yaml@>=2': '^2.8.3'
